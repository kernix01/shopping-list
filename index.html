<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>🛒 Shopping List</h1>
            <button id="theme-toggle" class="theme-btn">☀️ / 🌙</button>
        </header>

        <form id="shop-form">
            <input type="text" id="shop-input" placeholder="Что нужно купить?..." required autocomplete="off">
            <button type="submit" id="add-btn">Добавить</button>
        </form>

        <div id="list-container">
            <!-- Сюда JS будет вставлять карточки товаров -->
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
